<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="949px" preserveAspectRatio="none" style="width:582px;height:949px;background:#FFFFFF;" version="1.1" viewBox="0 0 582 949" width="582px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="197" x="185.5" y="24.5332">Life cycle of an LLMRequest</text><ellipse cx="287" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="Pending"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="72" x="251" y="158.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="251" x2="323" y1="186.2188" y2="186.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52" x="261" y="178.1426">Pending</text></g><g id="Skipped"><rect fill="#F1F1F1" height="67.7969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160" x="415" y="391.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="415" x2="575" y1="419.2188" y2="419.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51" x="469.5" y="411.1426">Skipped</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="99" x="420" y="436.6758">status = SKIPPED</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140" x="420" y="451.7695">classical decision stands</text></g><g id="CacheLookup"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="108" x="25" y="307.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="25" x2="133" y1="334.7188" y2="334.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88" x="35" y="326.6426">CacheLookup</text></g><g id="Resolved"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214" x="7" y="777.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="221" y1="805.2188" y2="805.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59" x="84.5" y="797.1426">Resolved</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112" x="12" y="822.6758">status = RESOLVED</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194" x="12" y="837.7695">answer replaces classical decision</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158" x="12" y="852.8633">provenance(used_llm = true)</text></g><g id="Sent"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="95" y="489.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="95" x2="145" y1="517.2188" y2="517.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="29" x="105.5" y="509.1426">Sent</text></g><g id="Retrying"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="73" x="247.5" y="633.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="247.5" x2="320.5" y1="661.2188" y2="661.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53" x="257.5" y="653.1426">Retrying</text></g><g id="Fallback"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185" x="256.5" y="777.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="256.5" x2="441.5" y1="805.2188" y2="805.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53" x="322.5" y="797.1426">Fallback</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="107" x="261.5" y="822.6758">status = FALLBACK</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140" x="261.5" y="837.7695">classical decision stands</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165" x="261.5" y="852.8633">provenance note with the error</text></g><ellipse cx="349" cy="932.6094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="349" cy="932.6094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN23"><path d="M168,302.6094 L168,328.1094 L133.29,332.1094 L168,336.1094 L168,361.6641 A0,0 0 0 0 168,361.6641 L442,361.6641 A0,0 0 0 0 442,361.6641 L442,312.6094 L432,302.6094 L168,302.6094 A0,0 0 0 0 168,302.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M432,302.6094 L432,312.6094 L442,312.6094 L432,302.6094 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253" x="174" y="321.1045">key = hash(model, prompt version, payload)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="174" y="337.4561">Same input and prompt version</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201" x="174" y="353.8076">give the same answer across runs.</text></g><!--link *start* to Pending--><g id="link_*start*_Pending"><path d="M287,64.7394 C287,84.1394 287,123.9794 287,152.4394 " fill="none" id="*start*-to-Pending" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="287,158.4394,291,149.4394,287,153.4394,283,149.4394,287,158.4394" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-fa